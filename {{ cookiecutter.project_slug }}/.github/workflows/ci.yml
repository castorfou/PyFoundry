name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  tests:
    name: Test on Python {% raw %}${{ matrix.python-version }}{% endraw %}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["{{ cookiecutter.python_version }}", "3.12"]

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python {% raw %}${{ matrix.python-version }}{% endraw %}
      run: uv python install {% raw %}${{ matrix.python-version }}{% endraw %}

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🔍 Lint with ruff
      run: uv run ruff check . --output-format=github

    - name: 🧪 Run tests
      run: |
        if [ -f tests/test_*.py ] || [ -d tests/ ]; then
          uv run pytest tests/ -v --cov=src --cov-report=term-missing
        else
          echo "No tests found. Creating placeholder test structure..."
          mkdir -p tests
          echo "# TODO: Add tests for {{ cookiecutter.project_name }}" > tests/test_placeholder.py
          echo "def test_placeholder():" >> tests/test_placeholder.py
          echo "    assert True  # Replace with actual tests" >> tests/test_placeholder.py
          uv run pytest tests/ -v
        fi

    - name: 🔧 Type check with mypy
      run: uv run mypy

  pre-commit:
    name: 🪝 Pre-commit hooks
    runs-on: ubuntu-latest
    env:
      # Venv hors du dépôt, comme dans le devcontainer (hook no-venv-at-root)
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 🔒 Check uv.lock is up to date
      run: uv lock --check

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🪝 Run pre-commit hooks
      run: uv run pre-commit run --all-files --show-diff-on-failure

  build:
    name: 🏗️ Build package
    runs-on: ubuntu-latest
    needs: [tests, pre-commit]
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 📦 Install build dependencies
      run: uv sync

    - name: 🏗️ Build package
      run: uv build

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

    - name: ✅ Verify package
      run: |
        echo "📦 Built packages:"
        ls -la dist/

        echo "📋 Package metadata:"
        ls -1 dist/*.whl | head -1 | xargs basename | sed 's/-[0-9].*//' | xargs -I {} uv run python -m pip show {} || echo "Package not installed yet"
