name: 🚀 Release Automation

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v0.5.0, etc.

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-tag:
    name: 🏷️ Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-prerelease: ${{ steps.check-prerelease.outputs.is-prerelease }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Get version from tag
        id: get-version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 🔎 Check tag against pyproject.toml, cookiecutter.json and CHANGELOG.md
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: python3 .github/scripts/release.py check-tag "$VERSION"

      - name: ✅ Check if prerelease
        id: check-prerelease
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release detected"
          else
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release detected"
          fi

  run-tests:
    name: 🧪 Run tests before release
    needs: validate-tag
    uses: ./.github/workflows/test-template.yml

  create-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, run-tests]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📝 Generate release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python3 .github/scripts/release.py notes "$VERSION" > release_notes.md

          {
            echo ""
            echo "## Usage"
            echo ""
            echo '```bash'
            echo "# Create a new project from this version of the template"
            echo "cruft create https://github.com/castorfou/PyFoundry.git --checkout $VERSION"
            echo ""
            echo "# Update an existing project to this version"
            echo "cruft update --checkout $VERSION"
            echo '```'
          } >> release_notes.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate-tag.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease }}

      - name: 📢 Notify on successful release
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ needs.validate-tag.outputs.version }}";
            const isPrerelease = "${{ needs.validate-tag.outputs.is-prerelease }}" === "true";

            const releaseType = isPrerelease ? "Pre-release" : "Stable release";

            const output = `## 🚀 ${releaseType} ${version} Published!

            ✅ All tests passed
            ✅ Release notes generated automatically
            ✅ GitHub release created

            **Template ready for use:**
            \`\`\`bash
            cruft create https://github.com/castorfou/PyFoundry.git --checkout ${version}
            \`\`\`

            📚 [View Release](https://github.com/castorfou/PyFoundry/releases/tag/${version})
            📖 [Documentation](https://castorfou.github.io/PyFoundry/)
            `;

            // Create a commit comment on the tag commit
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: output
            });
