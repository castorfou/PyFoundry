name: 🚀 Release Automation

# Une release part quand un merge sur main augmente la version de pyproject.toml
# (PR de release). Les autres merges ne publient rien. Le tag et la release sont
# créés ensemble par `gh release create` : aucun workflow ne dépend du tag.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: 🔎 Detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # commit précédent et tags existants

      - name: 🔎 Compare pyproject.toml with the previous commit
        id: plan
        env:
          BASE: ${{ github.event.before }}
        run: python3 .github/scripts/release.py plan --base "$BASE"

  run-tests:
    name: 🧪 Run tests before release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/test-template.yml

  publish:
    name: 🚀 Create tag and GitHub Release
    runs-on: ubuntu-latest
    needs: [plan, run-tests]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📝 Generate release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 .github/scripts/release.py notes "v$VERSION" > release_notes.md

          {
            echo ""
            echo "## Usage"
            echo ""
            echo '```bash'
            echo "# Create a new project from this version of the template"
            echo "cruft create https://github.com/castorfou/PyFoundry.git --checkout v$VERSION"
            echo ""
            echo "# Update an existing project to this version"
            echo "cruft update --checkout v$VERSION"
            echo '```'
          } >> release_notes.md

      - name: 🚀 Create tag and release on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file release_notes.md
