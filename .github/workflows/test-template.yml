name: 🧪 Test Template

on:
  push:
    branches: [ '**' ]  # Toutes les branches pour feedback immédiat
  pull_request:
    branches: [ main ]
  workflow_call:  # Permet l'appel depuis release.yml

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: 🔍 Lint with ruff
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 🔒 Check uv.lock is up to date
      run: uv lock --check

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🔍 Lint with ruff
      run: uv run ruff check . --output-format=github

  release-plan:
    name: 🔎 Release plan
    # Une PR de release incohérente (baisse, tag existant, CHANGELOG) échoue
    # avant le merge ; une PR ordinaire passe (version inchangée).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # branche cible et tags existants

    - name: 🔎 Compare pyproject.toml with the target branch
      env:
        BASE: origin/${{ github.base_ref }}
      run: python3 .github/scripts/release.py plan --base "$BASE"

  pre-commit:
    name: 🪝 Pre-commit hooks
    runs-on: ubuntu-latest
    env:
      # Venv hors du dépôt, comme dans le devcontainer (hook no-venv-at-root)
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🪝 Run pre-commit hooks
      run: uv run pre-commit run --all-files --show-diff-on-failure

  test-template:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: 📦 Install dependencies
      run: uv sync --extra test

    - name: 🧪 Run template generation tests
      run: uv run pytest tests/ -v

    - name: 🏗️ Test generated project validity
      env:
        # Venv hors du projet généré (hook no-venv-at-root), distinct de celui du template
        UV_PROJECT_ENVIRONMENT: /tmp/venv-generated
      run: |
        echo "🏗️ Generate test project..."
        uv run cruft create . --no-input --output-dir /tmp/test-projects

        cd /tmp/test-projects/mon-projet-data-science

        echo "📁 Verify project structure..."
        ls -la

        echo "📦 Test project installation..."
        uv sync --extra dev

        echo "🔍 Test ruff configuration..."
        uv run ruff check .

        echo "🔧 Test mypy configuration..."
        uv run mypy --show-error-codes

        echo "🪝 Test pre-commit configuration..."
        # cruft create ne crée pas de dépôt git, pre-commit en a besoin
        git init -q
        git add -A
        git -c user.name=pyfoundry-ci -c user.email=pyfoundry-ci@users.noreply.github.com commit -qm "Initial commit"
        uv run pre-commit run --all-files --show-diff-on-failure
